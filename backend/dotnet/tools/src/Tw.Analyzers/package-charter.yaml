schema_version: "1.0.0"
package: Tw.Analyzers
owner: dotnet-framework
responsibility: 提供 .NET 框架品牌标识符分段治理的 Roslyn 编译期诊断。
in_scope:
  - 声明符号中 Tw、Abp 和 Furion 品牌分段的 TWGOV001 编译期诊断
out_of_scope:
  - 运行时业务能力
  - 服务启动和依赖注入注册
  - 退役包检查和依赖边界检查，在专用 Roslyn 诊断实现前由 Tw.Cli 和架构测试承担
public_capabilities:
  - TWGOV001
dependency_rules:
  forbid:
    - runtime framework packages
  allow:
    - Microsoft.CodeAnalysis.CSharp
    - Microsoft.CodeAnalysis.Analyzers
stability: experimental
compatibility: TWGOV001 的诊断 ID 保持稳定，诊断触发条件随治理规则同步调整。
