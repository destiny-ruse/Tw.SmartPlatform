schema_version: "1.0.0"
package: Tw.AspNetCore.TestBase
owner: platform-team
stability: experimental
test_only: true
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供 ASP.NET Core 测试辅助能力，生产项目不得引用该包。
in_scope:
  - 带认证的 WebApplicationFactory
  - 测试认证处理器
out_of_scope:
  - 生产认证
public_capabilities:
  - Tw.AspNetCore.TestBase
dependency_rules:
  forbid:
    - 生产项目引用
  allow:
    - Tw.TestBase
    - Microsoft.AspNetCore.Mvc.Testing
