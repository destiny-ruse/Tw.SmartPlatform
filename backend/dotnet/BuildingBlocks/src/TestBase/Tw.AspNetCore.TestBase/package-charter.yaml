schema_version: "1.0.0"
package: Tw.AspNetCore.TestBase
owner: platform-team
stability: experimental
test_only: true
compatibility: "experimental stage does not promise compatibility"
responsibility: >
  ASP.NET Core test helpers. Production projects must not reference this package.
in_scope:
  - authenticated web application factory
  - test authentication handler
out_of_scope:
  - production authentication
public_capabilities:
  - Tw.AspNetCore.TestBase
dependency_rules:
  forbid:
    - production project references
  allow:
    - Tw.TestBase
    - Microsoft.AspNetCore.Mvc.Testing
