  - Outbox/Inbox 断言
out_of_scope:
  - 生产 CAP 传输
public_capabilities:
  - Tw.EventBus.Cap.TestBase
dependency_rules:
  forbid:
    - 生产项目引用
  allow:
    - Tw.TestBase
    - Tw.EventBus.Cap
    - Testcontainers
