schema_version: "1.0.0"
package: Tw.TestBase
owner: platform-team
stability: experimental
test_only: true
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供通用测试辅助能力与确定性测试原语，生产项目不得引用该包。
in_scope:
  - 测试时钟
  - 测试当前用户
  - 测试当前租户
  - 契约 JSON 选项
out_of_scope:
  - 生产运行时行为
public_capabilities:
  - Tw.TestBase
dependency_rules:
  forbid:
    - 生产项目引用
  allow: []
