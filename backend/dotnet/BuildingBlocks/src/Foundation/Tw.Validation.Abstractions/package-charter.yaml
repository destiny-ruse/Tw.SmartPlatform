schema_version: "1.0.0"
package: Tw.Validation.Abstractions
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  输入验证错误模型和验证异常基础契约。
in_scope:
  - 验证错误模型
  - 验证异常
  - 字段路径和错误码承载
out_of_scope:
  - 具体验证框架集成
  - HTTP 400 响应格式
  - UI 表单校验规则
public_capabilities:
  - Tw.Validation.Abstractions
dependency_rules:
  forbid:
    - "Microsoft.AspNetCore.*"
    - "FluentValidation"
    - "SqlSugar*"
  allow: []
