schema_version: "1.0.0"
package: Tw.Timing
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  系统时钟、固定时钟和时间访问抽象，供业务代码消除直接读取系统时间的耦合。
in_scope:
  - 时钟抽象
  - 系统 UTC 时钟
  - 测试固定时钟
  - 时间服务注册入口
out_of_scope:
  - 调度器
  - 定时任务执行
  - 业务时区策略
public_capabilities:
  - Tw.Timing
dependency_rules:
  forbid:
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - "Microsoft.Extensions.DependencyInjection.Abstractions"
