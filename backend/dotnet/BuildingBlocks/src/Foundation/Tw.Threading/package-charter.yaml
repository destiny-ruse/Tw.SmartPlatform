schema_version: "1.0.0"
package: Tw.Threading
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  取消令牌、异步辅助、后台执行上下文和线程安全工具。
in_scope:
  - 取消令牌 provider
  - 取消令牌覆盖作用域
  - 异步释放辅助
  - 线程安全工具
out_of_scope:
  - HTTP 请求上下文
  - 后台任务调度
  - 业务线程模型
public_capabilities:
  - Tw.Threading
dependency_rules:
  forbid:
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - "Microsoft.Extensions.DependencyInjection.Abstractions"
