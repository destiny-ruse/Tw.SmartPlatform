schema_version: "1.0.0"
package: Tw.Idempotency
owner: platform-team
stability: experimental
compatibility: "experimental stage does not promise compatibility"
responsibility: >
  Idempotency key models, reservations, stable conflict exception, executor, and trusted host context factories.
in_scope:
  - HTTP idempotency keys
  - gRPC idempotency keys
  - CAP message dedupe keys
  - background job fire keys
  - idempotency executor
out_of_scope:
  - SQL persistence
  - Redis persistence
public_capabilities:
  - Tw.Idempotency
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow: []
