schema_version: "1.0.0"
package: Tw.MultiTenancy
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供认证后的租户解析与租户一致性规则。
in_scope:
  - 租户解析器
  - 令牌租户与提示租户冲突检测
out_of_scope:
  - JWT 校验
  - 数据访问
  - 分片策略
public_capabilities:
  - Tw.MultiTenancy
dependency_rules:
  forbid:
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.MultiTenancy.Abstractions
