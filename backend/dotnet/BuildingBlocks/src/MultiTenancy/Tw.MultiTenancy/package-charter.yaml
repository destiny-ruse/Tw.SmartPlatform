schema_version: "1.0.0"
package: Tw.MultiTenancy
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供 provider-neutral 的当前租户契约、租户身份值对象与认证后租户一致性解析。
in_scope:
  - 当前租户契约
  - 租户身份值对象
  - 租户解析器
  - 令牌租户与提示租户冲突检测
out_of_scope:
  - JWT 校验
  - HTTP 租户访问器
  - provider-specific 租户存储
  - 分片策略
public_capabilities:
  - Tw.MultiTenancy
dependency_rules:
  forbid:
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow: []
