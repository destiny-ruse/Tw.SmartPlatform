schema_version: "1.0.0"
package: Tw.Sharding
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供与具体提供方无关的分片描述契约与异步调用链分片上下文。
in_scope:
  - 分片描述值对象
  - 当前分片契约
  - 分片上下文
  - 作用域内分片切换
out_of_scope:
  - 数据库连接路由
  - 分片路由策略
  - 特定提供方的分片存储
public_capabilities:
  - Tw.Sharding
dependency_rules:
  forbid:
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow: []
