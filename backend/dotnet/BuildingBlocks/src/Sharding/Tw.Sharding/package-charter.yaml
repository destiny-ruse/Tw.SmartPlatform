schema_version: "1.0.0"
package: Tw.Sharding
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供面向租户与资源感知路由决策的异步流分片上下文。
in_scope:
  - 分片上下文
  - 作用域内分片切换
out_of_scope:
  - SqlSugar 连接路由
  - 租户解析
  - CAP 存储分区
public_capabilities:
  - Tw.Sharding
dependency_rules:
  forbid:
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Sharding.Abstractions
