schema_version: "1.0.0"
package: Tw.AspNetCore.Mvc.NewtonsoftJson
owner: platform-team
stability: experimental
compatibility: "experimental stage does not promise compatibility"
responsibility: >
  Newtonsoft.Json MVC integration helpers including decimal-string long id conversion.
in_scope:
  - long id JSON converter
  - Newtonsoft.Json MVC support helpers
out_of_scope:
  - System.Text.Json converters
  - OpenAPI schema filters
public_capabilities:
  - Tw.AspNetCore.Mvc.NewtonsoftJson
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Newtonsoft.Json
    - Microsoft.AspNetCore.Mvc.NewtonsoftJson
