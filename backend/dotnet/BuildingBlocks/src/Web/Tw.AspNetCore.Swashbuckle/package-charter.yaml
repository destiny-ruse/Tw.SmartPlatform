schema_version: "1.0.0"
package: Tw.AspNetCore.Swashbuckle
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供 Swashbuckle 注册、Newtonsoft 支持、JWT 操作元数据、稳定错误响应元数据、XML 注释与 long id 字符串 schema 映射。
in_scope:
  - SwaggerGen 注册
  - Newtonsoft 支持
  - JWT 操作过滤器
  - 统一错误响应操作过滤器
  - long id schema 过滤器
out_of_scope:
  - MVC 模型绑定
  - 运行时认证
  - 生成客户端发布
public_capabilities:
  - Tw.AspNetCore.Swashbuckle
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Swashbuckle.AspNetCore
    - Swashbuckle.AspNetCore.Newtonsoft
