schema_version: "1.0.0"
package: Tw.AspNetCore.Localization
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  独立可选的 ASP.NET Core 多语言适配构建块：请求语言解析、当前本地化上下文、
  IStringLocalizer 适配、Web 侧服务注册和运行时本地化资源导出 DTO 契约。
in_scope:
  - ASP.NET Core localization namespace
  - request culture middleware
  - localization context accessor
  - ASP.NET Core 请求语言解析中间件
  - Web 请求本地化上下文访问器
  - IStringLocalizer 与 IStringLocalizer<T> 适配
  - Web 多语言依赖注入入口
  - 运行时本地化资源导出 DTO 契约
out_of_scope:
  - 多语言核心模型和回退编排
  - EF Core 表模型、DbContext、迁移或默认数据库实现
  - 管理端页面和管理 API
  - 具体业务领域模型
public_capabilities:
  - Tw.AspNetCore.Localization
dependency_rules:
  forbid:
    - "Microsoft.EntityFrameworkCore*"
  allow:
    - Tw.Core
    - Tw.Localization
    - Tw.AspNetCore.Mvc
    - Microsoft.AspNetCore.App
