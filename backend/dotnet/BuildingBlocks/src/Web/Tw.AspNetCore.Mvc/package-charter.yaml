schema_version: "1.0.0"
package: Tw.AspNetCore.Mvc
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  ASP.NET Core MVC 与 Web API 专属集成构建块，承载 HTTP 请求取消令牌 provider、
  MVC action 与 Razor Page handler 的 filter AOP adapter，
  以及面向 MVC/Razor Pages 的统一拦截 pipeline 接入。
in_scope:
  - MVC model binding errors
  - unified API response contracts
  - API Versioning URL Segment registration
  - CSRF and antiforgery validation policy
  - HTTP 请求取消令牌 provider
  - MVC action AOP filter adapter
  - Razor Page handler AOP filter adapter
  - MVC action 与 Razor Page handler invocation context
  - MVC 集成依赖注入入口
out_of_scope:
  - 跨协议 ASP.NET Core 宿主启动聚合入口
  - Middleware adapter
  - Minimal API endpoint filter adapter
  - gRPC interceptor 与 gRPC 专属能力
  - 与框架无关的基础原语
  - 数据访问、ORM、仓储实现
public_capabilities:
  - Tw.AspNetCore.Mvc.ModelBinding
  - Tw.AspNetCore.Mvc.Responses
  - Tw.AspNetCore.Mvc.Security
  - Tw.AspNetCore.Mvc.ApiVersioning
  - Tw.AspNetCore.Mvc
  - Tw.AspNetCore.Mvc.Context
  - Tw.AspNetCore.Mvc.DynamicProxy
dependency_rules:
  forbid:
    - "Microsoft.EntityFrameworkCore*"
  allow:
    - Asp.Versioning.Mvc
    - Asp.Versioning.Mvc.ApiExplorer
    - Tw.AspNetCore
    - Tw.DependencyInjection
    - Tw.Core
    - Tw.Threading
