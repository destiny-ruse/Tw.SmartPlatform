schema_version: "1.0.0"
package: Tw.EventBus
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供集成事件元数据、发布器、处理器与 transport 契约，以及基于注入传输实现的发布编排。
in_scope:
  - 集成事件元数据契约
  - 事件发布器实现
  - 事件处理器与传输契约
out_of_scope:
  - CAP 实现
  - RabbitMQ 配置
  - Outbox 存储
public_capabilities:
  - Tw.EventBus
dependency_rules:
  forbid:
    - "DotNetCore.CAP*"
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
  allow: []
