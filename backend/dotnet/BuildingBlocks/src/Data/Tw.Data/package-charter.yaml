schema_version: "1.0.0"
package: Tw.Data
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供数据访问契约、审计字段、软删除字段、仓储抽象与乐观并发契约。
in_scope:
  - 审计字段契约
  - 软删除契约
  - 乐观并发契约
  - 仓储抽象
out_of_scope:
  - SqlSugar 客户端创建
  - CAP Outbox 存储
  - 业务实体映射
public_capabilities:
  - Tw.Data
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
    - "Microsoft.AspNetCore.*"
  allow: []
