schema_version: "1.0.0"
package: Tw.Configuration
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供配置来源治理、敏感配置键契约、配置变更事件，以及 JSON 配置清单与路径校验。
in_scope:
  - 用户密钥环境策略
  - 配置变更事件
  - 敏感配置键模型
  - JSON 配置文件清单
  - 允许根目录的配置路径校验
  - 通配符扫描拒绝规则
out_of_scope:
  - Nacos 配置源适配
  - 服务发现
  - 密钥存储
public_capabilities:
  - Tw.Configuration
  - Tw.Configuration.Json
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
    - "Microsoft.AspNetCore.*"
  allow: []
