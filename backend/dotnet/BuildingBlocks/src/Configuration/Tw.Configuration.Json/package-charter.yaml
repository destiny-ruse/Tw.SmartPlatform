schema_version: "1.0.0"
package: Tw.Configuration.Json
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供 JSON 配置清单与配置路径校验。
in_scope:
  - JSON 配置文件清单
  - 允许根目录的路径校验
  - 通配符扫描拒绝规则
out_of_scope:
  - 密钥存储
  - Nacos 桥接
public_capabilities:
  - Tw.Configuration.Json
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Configuration
