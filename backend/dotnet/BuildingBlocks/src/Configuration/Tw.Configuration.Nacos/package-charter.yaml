schema_version: "1.0.0"
package: Tw.Configuration.Nacos
owner: platform-team
stability: experimental
compatibility: "experimental stage does not promise compatibility"
responsibility: >
  Nacos configuration and service discovery bridge without secret storage.
in_scope:
  - validated configuration key import
  - service discovery metadata import
  - configuration change events
out_of_scope:
  - secret storage
  - JSON path scanning
public_capabilities:
  - Tw.Configuration.Nacos
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Configuration
    - nacos-sdk-csharp
    - nacos-sdk-csharp.Extensions.Configuration
    - nacos-sdk-csharp.Extensions.ServiceDiscovery
