schema_version: "1.0.0"
package: Tw.Configuration.Nacos
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供不承载密钥存储的 Nacos 配置源适配。
in_scope:
  - 已校验配置键导入
  - 配置变更事件
out_of_scope:
  - 密钥存储
  - JSON 路径扫描
  - 服务发现
public_capabilities:
  - Tw.Configuration.Nacos
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Configuration
    - nacos-sdk-csharp
    - nacos-sdk-csharp.Extensions.Configuration
