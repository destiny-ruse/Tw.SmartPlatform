schema_version: "1.0.0"
package: Tw.Domain
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供不依赖 ORM 或数据库 provider 的实体审计、乐观并发与软删除形状契约。
in_scope:
  - 实体创建与更新审计标记
  - 实体并发戳与版本戳标记
  - 实体软删除标记
out_of_scope:
  - 具体限界上下文的业务 DTO、共享枚举与领域契约
  - 领域实体与聚合根基础类型
  - 应用服务编排与 MediatR Handler
  - 仓储、工作单元与数据访问实现
public_capabilities:
  - Tw.Domain.Auditing
  - Tw.Domain.Concurrency
  - Tw.Domain.SoftDelete
dependency_rules:
  forbid:
    - "MediatR"
    - "FluentValidation"
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
