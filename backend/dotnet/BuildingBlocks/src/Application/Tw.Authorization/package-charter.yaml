schema_version: "1.0.0"
package: Tw.Authorization
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  权限检查执行、授权 grant store 边界和权限 grant 缓存边界。
in_scope:
  - 权限检查执行
  - grant store 抽象使用
  - 权限 grant 缓存抽象使用
out_of_scope:
  - 权限数据库模型
  - JWT 发行和校验
  - OpenIddict Identity Center
public_capabilities:
  - Tw.Authorization
dependency_rules:
  forbid:
    - "Microsoft.AspNetCore.*"
    - "OpenIddict*"
    - "SqlSugar*"
  allow:
    - Tw.Authorization.Abstractions
