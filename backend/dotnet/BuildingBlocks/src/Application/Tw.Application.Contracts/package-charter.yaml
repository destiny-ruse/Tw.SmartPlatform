schema_version: "1.0.0"
package: Tw.Application.Contracts
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供不依赖 MediatR、FluentValidation 或基础设施 provider 的应用命令、查询标记与通用分页契约。
in_scope:
  - Command 标记接口
  - Query 标记接口
  - 通用分页请求与结果模型
out_of_scope:
  - 具体限界上下文的业务 DTO、共享枚举与服务契约
  - MediatR Handler 与应用 pipeline
  - FluentValidation validator
  - UoW 编排与权限检查执行
  - 数据访问或协议 provider 集成
public_capabilities:
  - Tw.Application.Contracts
dependency_rules:
  forbid:
    - "MediatR"
    - "FluentValidation"
    - "Microsoft.AspNetCore.*"
    - "SqlSugar*"
