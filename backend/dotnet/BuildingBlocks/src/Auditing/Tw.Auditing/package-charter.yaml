schema_version: "1.0.0"
package: Tw.Auditing
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供审计采集运行时、敏感审计明细脱敏与审计作用域。
in_scope:
  - 审计采集器
  - 审计作用域
  - 敏感审计明细脱敏
out_of_scope:
  - 特定存储实现
public_capabilities:
  - Tw.Auditing
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Auditing.Contracts
    - Tw.Observability
    - Tw.Security
