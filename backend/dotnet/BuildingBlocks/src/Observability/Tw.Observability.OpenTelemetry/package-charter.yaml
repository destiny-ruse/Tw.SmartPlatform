schema_version: "1.0.0"
package: Tw.Observability.OpenTelemetry
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供 OpenTelemetry 与 Aspire Dashboard 的配置模型边界。
in_scope:
  - OpenTelemetry 注册选项
  - Aspire Dashboard 配置模型
out_of_scope:
  - OpenTelemetry 服务注册与宿主装配
  - OTLP 导出器注册
  - ASP.NET Core 与 HTTP 插桩注册
  - 默认 gRPC 客户端插桩
  - 脱敏引擎
public_capabilities:
  - Tw.Observability.OpenTelemetry
dependency_rules:
  forbid:
    - 默认 gRPC 客户端插桩包
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Observability
    - OpenTelemetry.Extensions.Hosting
    - OpenTelemetry.Exporter.OpenTelemetryProtocol
    - OpenTelemetry.Instrumentation.AspNetCore
    - OpenTelemetry.Instrumentation.Http
