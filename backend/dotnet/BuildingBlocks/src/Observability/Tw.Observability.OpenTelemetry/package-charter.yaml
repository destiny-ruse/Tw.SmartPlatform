schema_version: "1.0.0"
package: Tw.Observability.OpenTelemetry
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供 OpenTelemetry 追踪、指标、OTLP 导出器、ASP.NET Core 插桩、HTTP 插桩与 Aspire Dashboard 选项。
in_scope:
  - OpenTelemetry 注册选项
  - OTLP 导出器边界
  - ASP.NET Core 插桩
  - HTTP 插桩
out_of_scope:
  - 默认 gRPC 客户端插桩
  - 脱敏引擎
public_capabilities:
  - Tw.Observability.OpenTelemetry
dependency_rules:
  forbid:
    - 默认 gRPC 客户端插桩包
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Observability
    - OpenTelemetry.Extensions.Hosting
    - OpenTelemetry.Exporter.OpenTelemetryProtocol
    - OpenTelemetry.Instrumentation.AspNetCore
    - OpenTelemetry.Instrumentation.Http
