schema_version: "1.0.0"
package: Tw.Observability
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供共享日志、追踪、指标、健康状态与关联上下文契约，脱敏能力由 Tw.Security.DataMasking 提供。
in_scope:
  - 关联上下文
  - 追踪上下文
  - 指标标签
  - 健康状态模型
out_of_scope:
  - 脱敏引擎
  - Serilog sink 注册
  - OpenTelemetry 导出器注册
public_capabilities:
  - Tw.Observability
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Security
