schema_version: "1.0.0"
package: Tw.Gateway.Yarp
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供网关运行时的 YARP 适配、服务发现绑定、转换器与路由校验。
in_scope:
  - YARP 注册
  - 路由校验
  - 请求头转换工厂
out_of_scope:
  - 数据访问
  - 工作单元
  - 应用管道
  - 事件总线与 CAP 消息
  - 后台任务
  - 多租户运行时
  - 分片运行时
public_capabilities:
  - Tw.Gateway.Yarp
dependency_rules:
  forbid:
    - 数据访问包
    - 工作单元包
    - 应用管道包
    - 事件总线包
    - 后台任务包
    - 多租户运行时包
    - 分片运行时包
  allow:
    - Tw.Gateway
    - Yarp.ReverseProxy
    - Microsoft.Extensions.ServiceDiscovery.Yarp
