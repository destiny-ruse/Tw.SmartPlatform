schema_version: "1.0.0"
package: Tw.BackgroundJobs.Quartz
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供 Quartz 调度器适配、Cron 校验、调度器存储选项与任务控制服务。
in_scope:
  - Cron 表达式校验
  - Quartz 调度器适配
  - 后台任务控制服务
out_of_scope:
  - 业务任务处理器
public_capabilities:
  - Tw.BackgroundJobs.Quartz
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.BackgroundJobs
    - Tw.BackgroundJobs.Abstractions
    - Quartz
