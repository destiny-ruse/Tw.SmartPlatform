schema_version: "1.0.0"
package: Tw.Http
owner: platform-team
stability: experimental
compatibility: "experimental stage does not promise compatibility"
responsibility: >
  Shared HTTP constants and protocol-neutral helpers.
in_scope:
  - HTTP header names
out_of_scope:
  - outbound HttpClient policies
  - ASP.NET Core middleware
public_capabilities:
  - Tw.Http
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Http.Abstractions
