schema_version: "1.0.0"
package: Tw.Http
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供共享 HTTP 常量与协议中立辅助能力。
in_scope:
  - HTTP 请求头名称
out_of_scope:
  - 出站 HttpClient 策略
  - ASP.NET Core 中间件
public_capabilities:
  - Tw.Http
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Http.Abstractions
