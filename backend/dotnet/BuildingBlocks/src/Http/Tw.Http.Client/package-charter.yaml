schema_version: "1.0.0"
package: Tw.Http.Client
owner: platform-team
stability: experimental
compatibility: "experimental 阶段不承诺兼容"
responsibility: >
  提供出站 HTTP 客户端请求头传播与韧性集成规则。
in_scope:
  - 可信请求头传播策略
  - HTTP 客户端韧性集成
out_of_scope:
  - ASP.NET Core 入站中间件
  - 网关路由
public_capabilities:
  - Tw.Http.Client
dependency_rules:
  forbid:
    - "SqlSugar*"
    - "DotNetCore.CAP*"
  allow:
    - Tw.Http
    - Tw.Http.Abstractions
    - Microsoft.Extensions.Http.Resilience
