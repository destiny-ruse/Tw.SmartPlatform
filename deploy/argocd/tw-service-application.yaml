apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tw-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.com/tw-smart-platform.git
    targetRevision: HEAD
    path: deploy/helm/tw-service
  destination:
    server: https://kubernetes.default.svc
    namespace: tw-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
